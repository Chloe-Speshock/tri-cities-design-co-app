user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting for bot protection
    limit_req_zone $binary_remote_addr zone=bot:10m rate=10r/s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

    server {
        listen 3000;
        server_name localhost;
        root /usr/share/nginx/html;

        # Block common bot requests
        location ~* \.(env|log|sql|bak|old|tmp|temp|php|asp|aspx|jsp|cgi)$ {
            deny all;
            return 404;
        }

        # Block common exploit attempts
        location ~* (vendor|wp-admin|admin|phpmyadmin|mysql|config|\.git|\.svn) {
            deny all;
            return 404;
        }

        # Block PHPUnit and other testing tools
        location ~* (phpunit|eval-stdin|composer|vendor) {
            deny all;
            return 404;
        }

        location / {
            limit_req zone=bot burst=20 nodelay;
            try_files $uri $uri/ /index.html;
        }

        # Handle CSS files
        location ~* \.css$ {
            add_header Content-Type text/css;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Handle JavaScript files
        location ~* \.js$ {
            add_header Content-Type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Handle image files
        location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Handle media folder specifically
        location /media/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
